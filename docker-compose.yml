services:
  postgres:
    image: postgres:16-alpine
    container_name: nodejs-TicketFlow-project
    restart: unless-stopped

    ports:
      - "5440:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs-ticketFlow

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: